name: Update gold price

# Once a day: fetch the international gold/silver price, convert to SAR per gram and save gold.json,
# which the app's zakat calculator downloads from GitHub Pages.
# On pull requests it only does a dry run (prints the result, saves nothing).

on:
  schedule:
    - cron: "17 5 * * *" # 08:17 Riyadh time
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/update-gold.mjs"
      - ".github/workflows/gold-price.yml"

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch prices and write gold.json
        run: node scripts/update-gold.mjs

      - name: Show the file
        run: cat gold.json

      - name: Commit gold.json
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold.json
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Update gold price"
          git push

      - name: Publish the site
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped"
