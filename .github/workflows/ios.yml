name: Build iOS app (simulator check)

# Stage 1: proves the iOS wrapper compiles on a cloud Mac. No Apple account is needed for this.
# Building a signed app for TestFlight / the App Store needs a paid Apple Developer account (added later).

on:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - "assets/**"
      - "index.html"
      - "privacy.html"
      - "manifest.json"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show toolchain
        run: |
          xcodebuild -version
          node -v

      - name: Create the iOS project (web files, icon, permissions, sounds)
        run: ios-app/prepare.sh

      - name: Build for the iOS Simulator (unsigned)
        working-directory: ios-app/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -40
          test ${PIPESTATUS[0]} -eq 0

      - name: Check the built app contains the sounds and the bridge
        working-directory: ios-app/ios/App
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          ls "$APP" | head -50
          test -f "$APP/adhan-makkah.caf"
          test -f "$APP/adhan-madinah.caf"
          grep -q "ios-bridge.js" "$APP/public/index.html"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$APP/Info.plist"
          test -f "$APP/Assets.car"
          test -f "$APP/public/ios-bridge.js"
          echo "OK: sounds and bridge are in the app"
