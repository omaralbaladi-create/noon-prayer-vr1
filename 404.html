<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#047857" />
  <title>الصفحة غير موجودة | Page not found</title>
  <style>
    :root { --bg:#f6fffb; --text:#0f172a; --muted:#475569; --primary:#0b7e5e; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --text:#e5eef9; --muted:#9fb0c7; --primary:#5eead4; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family: "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif; text-align:center; padding:24px; }
    h1 { font-size:3rem; margin:0; color:var(--primary); }
    p { color:var(--muted); margin:8px 0; }
    a { display:inline-block; margin-top:16px; padding:10px 20px; border-radius:12px; background:var(--primary); color:var(--bg); text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>الصفحة التي تبحث عنها غير موجودة.</p>
    <p lang="en" dir="ltr">The page you are looking for does not exist.</p>
    <a id="home-link" href="./index.html">العودة إلى التطبيق / Back to the app</a>
  </main>
  <script>
    // On GitHub project pages the app lives under /<repo>/, so point home from the first path segment.
    (function () {
      var link = document.getElementById("home-link");
      var parts = location.pathname.split("/").filter(Boolean);
      var isGithubPages = /\.github\.io$/.test(location.hostname);
      link.href = isGithubPages && parts.length ? "/" + parts[0] + "/index.html" : "/index.html";
    })();
  </script>
</body>
</html>
