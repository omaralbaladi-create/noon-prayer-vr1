plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.omaralbaladi.noorprayer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.omaralbaladi.noorprayer'
        minSdk 24
        targetSdk 34
        versionCode 100 + runNumber
        versionName '1.5.0'
    }

    signingConfigs {
        release {
            // A fixed key so every new build installs over the old one and keeps your settings.
            // This is a personal sideload key, not a Play Store key.
            storeFile file('../noor-release.keystore')
            storePassword 'noorprayer'
            keyAlias 'noor'
            keyPassword 'noorprayer'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'mp3'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
