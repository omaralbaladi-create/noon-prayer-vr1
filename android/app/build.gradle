plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.omaralbaladi.noorprayer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.omaralbaladi.noorprayer'
        minSdk 24
        targetSdk 34
        versionCode 100 + runNumber
        versionName '1.5.0'
    }

    // The signing key is NOT in the repository. CI decodes it from GitHub secrets and passes it in
    // through these environment variables. Without them (a local build) the APK is debug-signed.
    def releaseKeystore = System.getenv('KEYSTORE_FILE')

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'noor'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'mp3'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
