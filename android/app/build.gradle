plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

// AdMob ids live in android/admob.properties (they are public, not secrets).
// Until real ids are put there, Google's TEST ids are used, so no real ad is ever shown or clicked by mistake.
def admob = new Properties()
file('../admob.properties').withInputStream { admob.load(it) }
// -PadmobLive=true (used only for the Google Play bundle) switches to the real ids.
def admobLive = project.hasProperty('admobLive')
def admobAppId = admobLive ? admob.getProperty('liveAppId') : admob.getProperty('appId')
def admobBannerId = admobLive ? admob.getProperty('liveBannerId') : admob.getProperty('bannerId')

android {
    namespace 'com.omaralbaladi.noorprayer'
    compileSdk 36

    defaultConfig {
        // The store ID of the app. It can never be changed once the first release is uploaded to Google Play.
        // (The code's own package, `namespace` above, is internal and unrelated to this.)
        applicationId 'com.ageandcalculate.noorprayer'
        minSdk 24
        targetSdk 36
        versionCode 100 + runNumber
        versionName '1.6.1'
        manifestPlaceholders = [admobAppId: admobAppId]
        buildConfigField 'String', 'ADMOB_BANNER_ID', '"' + admobBannerId + '"'
    }

    // The signing key is NOT in the repository. CI decodes it from GitHub secrets and passes it in
    // through these environment variables. Without them (a local build) the APK is debug-signed.
    def releaseKeystore = System.getenv('KEYSTORE_FILE')

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'noor'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        noCompress 'mp3'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
